name: Build Midnight APK

# Builds the Midnight Green restyle of Metrolist on GitHub's free runners.
# Run it from the Actions tab ("Run workflow"), or it runs on every push to main.
on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain assembleFossRelease -x lint -x lintFossRelease --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music.midnight
          METROLIST_APP_NAME: Metrolist Midnight
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Sign APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out
          for apk in $(find app/build/outputs/apk/foss/release -name "*.apk"); do
            name=$(basename "$apk" .apk | sed 's/-unsigned//')
            "$BT/zipalign" -f -p 4 "$apk" "out/${name}-aligned.apk"
            "$BT/apksigner" sign \
              --ks keystore/midnight.jks --ks-pass pass:midnight123 \
              --ks-key-alias midnight --key-pass pass:midnight123 \
              --out "out/Metrolist-Midnight-${name}.apk" "out/${name}-aligned.apk"
            rm "out/${name}-aligned.apk"
          done
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-Midnight-APK
          path: out/*.apk
